<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESSU-GradDocuFlow | Admin Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../loginform/loginform.css">
</head>

<body>

    <div class="container">
        <div class="auth-card">

            <!-- Header -->
            <div class="card-header">
                <div class="logo-wrapper">
                    <img src="C:\Users\Christian\Documents\ESSUDOCUFLOW\Pictures\ESSU.jpg" alt="ESSU Logo" class="main-logo">
                </div>

                <h1 class="brand-name">
                    ESSU-Grad<span>DocuFlow</span>
                </h1>
                <p class="tagline">Official Graduation Document Management</p>
            </div>

            <!-- ADMIN TEXT -->
            <p class="role-label">ADMIN LOGIN</p>

            <!-- Login Form -->
            <form class="auth-form">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="admin@essu.edu.ph" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-green">Sign In</button>
            </form>

        </div>
    </div>

</body>
</html>
